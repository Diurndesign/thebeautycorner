# ============================================================
# Configuration Pages CMS (https://pagescms.org)
# Décrit ce que la cliente peut modifier depuis l'interface d'admin.
# Les modifications sont enregistrées dans data/content.json puis le
# site est redéployé automatiquement (Vercel).
# ============================================================

media:
  input: assets
  output: /assets

content:
  - name: contenu
    label: Contenu du site
    type: file
    path: data/content.json
    fields:
      - name: planity
        label: Lien de réservation Planity
        description: L'adresse de la page Planity (utilisée par tous les boutons « Prendre rendez-vous » / « Réserver »).
        type: string
        pattern: "url"

      - name: prestations
        label: Prestations (cartes)
        description: Cartes de la section Prestations. Image, titre et texte modifiables.
        type: object
        list: true
        fields:
          - { name: nom, label: Titre, type: string }
          - { name: description, label: Description, type: text }
          - { name: image, label: Image de la carte, type: image }

      - name: avantApres
        label: Galerie Avant / Après
        description: Une ligne par prestation. Glissez vos photos avant et après.
        type: object
        list:
          min: 1
        fields:
          - { name: categorie, label: Prestation, type: string }
          - { name: avant, label: Photo AVANT, type: image }
          - { name: apres, label: Photo APRÈS, type: image }

# Note : la section Instagram est gérée par Behold (feed live), donc elle
# n'apparaît pas ici — rien à modifier côté CMS pour Instagram.
