# ============================================================
# Configuration Pages CMS (https://pagescms.org)
# Décrit ce que la cliente peut modifier depuis l'interface d'admin.
# Les modifications sont enregistrées dans data/content.json puis le
# site est redéployé automatiquement (Vercel).
# ============================================================

media:
  input: assets
  output: /assets

content:
  - name: contenu
    label: Contenu du site
    type: file
    path: data/content.json
    fields:
      - name: avantApres
        label: Galerie Avant / Après
        description: Une ligne par prestation. Glissez vos photos avant et après.
        type: object
        list:
          min: 1
        fields:
          - { name: categorie, label: Prestation, type: string }
          - { name: avant, label: Photo AVANT, type: image }
          - { name: apres, label: Photo APRÈS, type: image }

      - name: instagram
        label: Section Instagram
        type: object
        fields:
          - { name: handle, label: "Identifiant (@…)", type: string }
          - { name: url, label: Lien du profil Instagram, type: string, pattern: "url" }
          - { name: abonnes, label: "Nombre d'abonnés (texte affiché)", type: string }
          - name: posts
            label: Publications (3 max)
            description: Photo ou vidéo. Choisissez le type puis déposez le fichier.
            type: object
            list:
              max: 3
            fields:
              - name: type
                label: Type de média
                type: select
                options:
                  values:
                    - image
                    - video
              - { name: src, label: Fichier (photo ou vidéo), type: image }
